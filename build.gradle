plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu нужен только для кнопки настроек, без него мод тоже работает
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// gradlew runPreview — открывает настройки мода и сохраняет скриншоты всех вкладок в run/screenshots.
loom {
	runs {
		preview {
			client()
			name = "Preview"
			vmArg "-Dautoominousbottle.devPreview=true"
		}
	}
}

// gradlew runClientGameTest — клиентские тесты в настоящем мире: еда, одна бутылка, возврат меча, прыжок.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "autoominousbottle-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
